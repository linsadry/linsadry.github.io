name: Mirror to private repo
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push mirror
        env:
          PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git remote add private https://linsadry:${PAT}@github.com/linsadry/cuidabem-private.git
          git push private HEAD:main --force
