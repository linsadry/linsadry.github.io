name: Mirror to private repo

on:
  push:
    branches: [main, master]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        run: |
          git remote add private https://linsadry:${{ secrets.MIRROR_TOKEN }}@github.com/linsadry/cuidabem-private.git
          git push private --mirror
