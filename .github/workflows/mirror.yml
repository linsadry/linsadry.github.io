name: Mirror to private repo
on:
  push:
    branches: [main]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror
        env:
          PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global http.https://github.com/.extraheader "Authorization: Basic $(echo -n "linsadry:${PAT}" | base64)"
          git remote add private https://github.com/linsadry/cuidabem-private.git
          git push private HEAD:main --force
          
